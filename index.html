<script>
// ---------- helpers ----------
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt=v=>v===undefined?'—':(typeof v==='string'?`"${v}"`:String(v));
function hlPlain(t){
  const re=/("[^"]*"|'[^']*')|(#.*$)|\b(while|for|in|True|False|and|or|not|if|elif|else|break|continue|import)\b/g;
  let out='',last=0,m;
  while((m=re.exec(t))){out+=esc(t.slice(last,m.index));
    out+=`<span class="${m[1]?'t-str':m[2]?'t-com':'t-kw'}">${esc(m[0])}</span>`;last=re.lastIndex}
  return out+esc(t.slice(last));
}
const hl=code=>code.split(/(\{[icu]:[^}]*\})/).map(seg=>{const m=seg.match(/^\{([icu]):(.*)\}$/);
  return m?`<span class="mk mk-${m[1]}">${hlPlain(m[2])}</span>`:hlPlain(seg)}).join('');
const plain=code=>code.replace(/\{[icu]:([^}]*)\}/g,'$1');
function rangeArr(a,b,c=1){const r=[];for(let v=a;(c>0?v<b:v>b)&&r.length<300;v+=c)r.push(v);return r}

// ---------- 학습지 예제 ----------
const PROGS={
  ex11:{name:'[예제1-1]',vars:['i'],
    flow:{init:'i = 0',cond:'i < 5 ?',body:'print("Hello")\ni += 1',exit:'반복 끝'},
    lines:[
      {code:'{i:i = 0}',op:'set',v:'i',f:()=>0},
      {code:'while {c:i < 5}:',op:'while',cond:s=>s.i<5,sub:s=>`${s.i} < 5`},
      {code:'    print("Hello")',op:'print',f:()=>['Hello']},
      {code:'    {u:i+=1}',op:'set',v:'i',f:s=>s.i+1,expr:s=>`${s.i} + 1`}
    ]},
  ex14:{name:'[예제1-4]',vars:['a','num'],secret:['a'],
    lines:[
      {code:'import random',op:'noop',note:'random 모듈을 불러와요'},
      {code:'a=random.randint(1,20)',op:'set',v:'a',f:()=>1+Math.floor(Math.random()*20),note:'a에 1~20 중 아무 수나 저장 (비밀!)'},
      {code:'while True:',op:'while',cond:()=>true,sub:()=>'True'},
      {code:'    num = int(input("1부터 20사이의 숫자를 맞춰보세요"))',op:'input',v:'num',prompt:'1부터 20사이의 숫자를 맞춰보세요'},
      {code:'    if num>20 or num<1:',op:'if',cond:s=>s.num>20||s.num<1,sub:s=>`${s.num}>20 or ${s.num}<1`},
      {code:'        print("다시 입력하세요.")',op:'print',f:()=>['다시 입력하세요.']},
      {code:'    else:',op:'else'},
      {code:'        if num > a:',op:'if',cond:s=>s.num>s.a,sub:s=>`${s.num} > a`},
      {code:'            print("더 작은 수 입니다.")',op:'print',f:()=>['더 작은 수 입니다.']},
      {code:'        elif num <a:',op:'elif',cond:s=>s.num<s.a,sub:s=>`${s.num} < a`},
      {code:'            print("더 큰 수 입니다.")',op:'print',f:()=>['더 큰 수 입니다.']},
      {code:'        else:',op:'else'},
      {code:'            print("정답입니다")',op:'print',f:()=>['정답입니다']},
      {code:'            break',op:'break'}
    ]}
};
const PAIRS_CONVERT=[
  {name:'변환 ① 1부터 19까지 출력',no:'변환 ①',title:'1부터 19까지 출력',
   L:{name:'for문',vars:['i'],lines:[
     {code:'for i in range({i:1},{c:20}):',op:'for',v:'i',range:[1,20],rtext:'range(1,20)'},
     {code:'    print(i, end=" ")',op:'print',f:s=>[s.i],end:' '}]},
   R:{name:'while문',vars:['i'],lines:[
     {code:'{i:i=1}',op:'set',v:'i',f:()=>1},
     {code:'while {c:i < 20}:',op:'while',cond:s=>s.i<20,sub:s=>`${s.i} < 20`},
     {code:'    print(i,end=" ")',op:'print',f:s=>[s.i],end:' '},
     {code:'    {u:i+=1}',op:'set',v:'i',f:s=>s.i+1,expr:s=>`${s.i} + 1`}]}},
  {name:'변환 ② 구구단',no:'변환 ②',title:'구구단',
   L:{name:'for문',vars:['n','i'],lines:[
     {code:'n = int(input("단?"))',op:'input',v:'n',prompt:'단?'},
     {code:'for i in range({i:1}, {c:10}):',op:'for',v:'i',range:[1,10],rtext:'range(1, 10)'},
     {code:'   print(n,"*",i,"=",n*i)',op:'print',f:s=>[s.n,'*',s.i,'=',s.n*s.i]}]},
   R:{name:'while문',vars:['n','i'],lines:[
     {code:'n = int(input("단?"))',op:'input',v:'n',prompt:'단?'},

const brkLines=kw=>[
  {code:'for i in range(1, 15):',op:'for',v:'i',range:[1,15],rtext:'range(1, 15)'},

// ---------- interpreter ----------
const LOOP=o=>o==='while'||o==='for',HEAD=o=>LOOP(o)||o==='if'||o==='elif'||o==='else';
function prepare(p){
  const lines=p.lines.map(l=>({...l,plain:plain(l.code)})),n=lines.length;
  lines.forEach(l=>{const sp=l.plain.match(/^ */)[0].length;l.ind=sp});
  const parent=lines.map((l,k)=>{for(let j=k-1;j>=0;j--)if(lines[j].ind<l.ind&&HEAD(lines[j].op))return j;return -1});
  const bend=lines.map((l,k)=>{let e=k+1;while(e<n&&lines[e].ind>l.ind)e++;return e});
  const chainEnd=k=>{let j=bend[k];while(j<n&&lines[j].ind===lines[k].ind&&(lines[j].op==='elif'||lines[j].op==='else'))j=bend[j];return j};
  // 블록 cur을 끝내고 pos로 넘어갈 때 실제로 갈 곳
  const fall=(cur,pos)=>{for(;;){const pr=parent[cur];if(pr<0)return pos;if(pos<bend[pr])return pos;
    if(LOOP(lines[pr].op))return pr;pos=chainEnd(pr);cur=pr;}};
  lines.forEach((l,k)=>{if(l.op==='while')l.condText=l.plain.trim().replace(/^while\s+/,'').replace(/:$/,'');
    if(l.op==='if'||l.op==='elif')l.condText=l.plain.trim().replace(/^(if|elif)\s+/,'').replace(/:$/,'');
    if(l.op==='for')l.condText=`${l.rtext}에 값이 남았나?`});
  const loopOf=k=>{let j=parent[k];while(j>=0&&!LOOP(lines[j].op))j=parent[j];return j};
  const first=lines.findIndex(l=>LOOP(l.op));
  lines.forEach((l,k)=>{l.role=k===first?'cond':k<first?'init':k<bend[first]?'body':'exit'});
  return{...p,lines,parent,bend,fall,loopOf,chainEnd,n};
}
const initState=()=>({pc:0,vars:{},out:'',it:{},iter:0,step:0,done:false,halt:false,info:null});
function exec(p,s,inp,guess){
  const ns={...s,vars:{...s.vars},it:JSON.parse(JSON.stringify(s.it)),step:s.step+1};
  const k=s.pc,L=p.lines[k],info={line:k,node:L.role,changed:[],old:{},outFrom:-1};
  let next=p.fall(k,k+1);
  const setv=(v,val)=>{info.old[v]=ns.vars[v];ns.vars[v]=val;info.changed.push(v)};
  switch(L.op){
    case 'noop':info.note=L.note;break;
    case 'set':{const val=L.f(ns.vars);info.note=L.note||(L.expr?`${L.v} = ${L.expr(s.vars)} = ${fmt(val)}`:`${L.v}에 ${fmt(val)} 저장`);setv(L.v,val);break}
    case 'print':{const t=L.f(ns.vars).map(String).join(' ')+(L.end!==undefined?L.end:'\n');info.outFrom=ns.out.length;ns.out+=t;info.note=`출력: ${t.trim()||'(공백)'}`;break}
    case 'input':{const val=parseInt(inp,10);info.outFrom=ns.out.length;ns.out+=L.prompt+'\u0001'+val+'\u0002\n';setv(L.v,val);info.note=`입력한 ${val}을(를) ${L.v}에 저장`;break}
    case 'while':{const r=!!L.cond(ns.vars);info.cond={text:L.condText,sub:L.sub(ns.vars),r};
      if(r){next=k+1;ns.iter++;info.note='반복 안으로'}else{next=p.fall(k,p.bend[k]);info.note='반복 끝';info.jump='⤵ 반복 끝'}break}
    case 'for':{const[a,b,c]=L.range;const it=ns.it[k]||{vals:rangeArr(a,b,c),i:0};const rest=it.vals.slice(it.i);
      if(it.i<it.vals.length){const val=it.vals[it.i++];ns.it[k]=it;setv(L.v,val);ns.iter++;next=k+1;
        info.cond={text:L.condText,sub:`[${rest.join(', ')}]`,r:true};info.note=`${L.v}에 ${val} 넣고 반복 안으로`}
      else{delete ns.it[k];info.cond={text:L.condText,sub:'[ ]',r:false};next=p.fall(k,p.bend[k]);info.note='꺼낼 값 없음 → 반복 끝';info.jump='⤵ 반복 끝'}break}
    case 'if':case 'elif':{const r=!!L.cond(ns.vars);info.cond={text:L.condText,sub:L.sub(ns.vars),r};
      if(r){next=k+1;info.note='True → 안쪽 실행'}
      else{const j=p.bend[k];const nx=p.lines[j];
        if(nx&&nx.ind===L.ind&&nx.op==='elif'){next=j;info.note='False → elif 검사'}
        else if(nx&&nx.ind===L.ind&&nx.op==='else'){next=j+1;info.note='False → else 쪽 실행'}
        else{next=p.fall(k,j);info.note='False → 건너뛰기'}
        info.jump='⤵ 건너뛰기'}break}
    case 'break':{const lp=p.loopOf(k);delete ns.it[lp];next=p.fall(lp,p.bend[lp]);info.note='break → 반복문을 바로 끝내요';info.jump='⤵ break! 반복 탈출';break}
    case 'continue':{const lp=p.loopOf(k);next=lp;info.note='continue → 아래는 건너뛰고 반복 처음으로';info.jump='↩ continue! 반복 처음으로';break}
  }
  if(guess!==undefined&&info.cond)info.pred={ok:guess===info.cond.r};
  if(!info.jump&&next<=k&&next>=0&&next<p.n)info.jump='↩ 반복 처음으로 돌아가요';
  ns.pc=next;ns.info=info;
  if(next>=p.n)ns.done=true;
  if(ns.step>500)ns.halt=true;
  return ns;
}

  <marker id="ahOn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" class="ah-on"/></marker></defs>
  <g data-node="init"><rect x="95" y="6" width="170" height="48" rx="8"/>${T(180,30,f.init)}</g>

  <g data-node="cond"><polygon points="180,84 286,132 180,180 74,132"/>${T(180,132,f.cond)}</g>

  <text x="188" y="198" class="fl-lab lab-t">True</text>
  <g data-node="body"><rect x="85" y="212" width="190" height="64" rx="8"/>${T(180,244,f.body)}</g>
  <path class="ar" data-arrow="back" d="M85 244 H32 V132 H72" marker-end="url(#ah)"/>
  <path class="ar" data-arrow="false" d="M286 132 H336 V328 H277" marker-end="url(#ah)"/>
  <text x="292" y="122" class="fl-lab lab-f">False</text>

  </svg>`;

const ARROW={'init>cond':'init','cond>body':'true','body>cond':'back','cond>exit':'false'};

// ---------- Runner ----------
let uid=0;
class Runner{
  constructor(el,prog,opt={}){this.el=el;this.opt=opt;this.id=++uid;this.load(prog)}
  load(prog){this.stopAuto&&this.el.querySelector('[data-a]')&&this.stopAuto();this.p=prepare(prog);this.hist=[initState()];this.asking=false;this.shown={};this.build();this.render()}
  stopAuto(){if(this.timer){clearTimeout(this.timer);this.timer=null}const b=this.el.querySelector('[data-a="auto"]');if(b)b.textContent='⏵ 자동'}
  get s(){return this.hist[this.hist.length-1]}
  get isDone(){return this.s.done||this.s.halt}
  q(r){return this.el.querySelector(`[data-r="${r}"]`)}
  build(){
    const p=this.p;
    if(this.opt.compact){
      this.el.innerHTML=`<div class="cmp-head"><b>${p.name}</b><span data-r="count"></span></div>
      <div class="mini-ctl"><button data-a="reset">↺ 처음부터</button><button data-a="prev">◀ 이전</button><button data-a="next" class="primary">다음 ▶</button><button data-a="auto">⏵ 자동</button></div>
      <div class="code${this.opt.marks?' marks-on':''}" data-r="code"></div><div class="jump" data-r="jump"></div>
      <div class="condcard small" data-r="cond"></div>
      <div class="cmp-row"><div><div class="pane-h">변수</div><div class="vars" data-r="vars"></div></div>
      <div><div class="pane-h">출력</div><div class="console" data-r="out"></div></div></div>`;
      const A=a=>this.el.querySelector(`[data-a="${a}"]`);
      A('reset').onclick=()=>{this.stopAuto();this.reset()};
      A('prev').onclick=()=>{this.stopAuto();this.prev()};
      A('next').onclick=()=>this.next();
      A('auto').onclick=()=>{if(this.timer)return this.stopAuto();if(this.isDone)this.reset();A('auto').textContent='⏸ 멈춤';
        const t=()=>{const r=this.next();if(r!=='ok'||this.isDone)return this.stopAuto();this.timer=setTimeout(t,800)};this.timer=setTimeout(t,50)};
    }else{
      this.el.innerHTML=`<div class="rgrid${p.flow?'':' noflow'}">
      <section class="pane"><div class="code" data-r="code"></div><div class="jump" data-r="jump"></div></section>
      <section class="pane"><div class="condcard" data-r="cond"></div>
        <div class="pane-h">변수</div><div class="vars" data-r="vars"></div>
        <div class="pane-h">출력</div><div class="console" data-r="out"></div></section>
      ${p.flow?`<section class="pane flowpane"><div data-r="flow">${flowSVG(p.flow)}</div></section>`:''}
      </div>
      <details class="trace"><summary>추적표 보기</summary><div class="tablewrap" data-r="table"></div></details>`;
    }
    if(this.opt.noCopy)this.q('code').classList.add('nocopy');
  }
  next(inp,guess){
    if(this.isDone)return 'done';
    const L=this.p.lines[this.s.pc];
    if(L.op==='input'&&inp===undefined){const i=this.q('inp');i&&i.focus();return 'input'}
    if(this.opt.predict&&this.opt.predict()&&L.condText&&guess===undefined){this.asking=true;this.render();return 'ask'}
    this.asking=false;this.hist.push(exec(this.p,this.s,inp,guess));this.render();return 'ok';
  }
  prev(){if(this.asking){this.asking=false;this.render();return}if(this.hist.length>1){this.hist.pop();this.render()}}
  reset(){this.hist=[this.hist[0]];this.asking=false;this.shown={};this.render()}
  render(){
    const p=this.p,s=this.s,info=s.info;
    this.q('code').innerHTML=p.lines.map((l,k)=>`<div class="ln${info&&info.line===k?' done':''}"><span class="no">${k+1}</span><span class="tx">${hl(l.code)}</span></div>`).join('');
    this.q('jump').textContent=info&&info.jump?info.jump:'';
    // 상태 카드
    const c=this.q('cond');let h='';
    if(this.asking){
      h=`<div class="ask"><div class="q"><code>${esc(p.lines[s.pc].condText)}</code> 은(는)?</div>
      <div class="btns"><button class="bt" data-g="1">True</button><button class="bf" data-g="0">False</button></div></div>`;
    }else if(!info){
      h=`<div class="note muted">‘다음’을 눌러 시작</div>`;
    }else{
      h=`<div class="stepinfo">${s.step}단계 · 반복 ${s.iter}회</div>`;
      if(info.cond)h+=`<div class="expr"><code>${esc(info.cond.text)}</code><span class="arr">→</span>${info.cond.sub!==info.cond.text?`<code>${esc(info.cond.sub)}</code><span class="arr">→</span>`:''}<span class="badge ${info.cond.r?'T':'F'}">${info.cond.r?'True':'False'}</span></div>`;
      h+=`<div class="note">${esc(info.note)}</div>`;
      if(info.pred)h+=info.pred.ok?`<div class="banner ok">✓ 맞았어요</div>`:`<div class="banner bad">✗ 틀렸어요</div>`;
    }
    if(s.done)h+=`<div class="banner done">끝 · 반복 ${s.iter}번</div>`;
    c.innerHTML=h;
    c.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>this.next(undefined,b.dataset.g==='1'));
    // 변수
    const sec=p.secret||[];
    this.q('vars').innerHTML=p.vars.map(v=>{
      const val=s.vars[v],ch=info&&info.changed.includes(v),hide=sec.includes(v)&&val!==undefined&&!this.shown[v]&&!s.done;
      return `<div class="var${val===undefined?' empty':''}${ch?' changed':''}${hide?' secret':''}" ${hide?`data-show="${v}" title="눌러서 보기"`:''}><span class="vn">${v}</span><span class="vv">${val===undefined?'?':hide?'🔒':esc(val)}</span><span class="vo">${hide?'눌러서 보기':ch&&info.old[v]!==undefined?`← ${esc(info.old[v])}`:''}</span></div>`}).join('');
    this.q('vars').querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{this.shown[b.dataset.show]=true;this.render()});
    // 출력
    const out=this.q('out');
    const fmtOut=t=>esc(t).replace(/\u0001([^\u0002]*)\u0002/g,'<span class="inv">$1</span>');
    let oh=info&&info.outFrom>=0?fmtOut(s.out.slice(0,info.outFrom))+`<span class="newest">${fmtOut(s.out.slice(info.outFrom))}</span>`:fmtOut(s.out);
    const L=p.lines[s.pc];
    if(!this.isDone&&L&&L.op==='input'&&!this.asking)
      oh+=`<div class="inrow"><span>${esc(L.prompt)}</span><input type="number" data-r="inp" id="inp-${this.id}-${s.step}" aria-label="숫자 입력"><button data-r="inbtn">입력</button></div>`;
    out.innerHTML=oh;out.scrollTop=out.scrollHeight;
    const inp=this.q('inp');
    if(inp){const go=()=>{if(inp.value.trim()==='')return inp.focus();this.next(inp.value);this.opt.onStep&&this.opt.onStep()};
      inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};this.q('inbtn').onclick=go;}
    if(this.opt.compact)this.q('count').textContent=`${s.step}단계${s.done?' · 끝':''}`;
    // 흐름도
    const fl=this.q('flow');
    if(fl){
      const prev=this.hist.length>1?this.hist[this.hist.length-2].info:null;
      let on=info?[info.node]:[],key=info&&prev?ARROW[prev.node+'>'+info.node]:null;
      if(info&&info.cond&&!info.cond.r&&info.node==='cond'){on=['cond','exit'];key='false'}
      fl.querySelectorAll('[data-node]').forEach(g=>g.classList.toggle('on',on.includes(g.dataset.node)));
      fl.querySelectorAll('[data-arrow]').forEach(a=>{const o=a.dataset.arrow===key;a.classList.toggle('on',o);a.setAttribute('marker-end',o?'url(#ahOn)':'url(#ah)')});
    }
    // 추적표
    const tb=this.q('table');
    if(tb){
      if(this.hist.length<2)tb.innerHTML='<p style="color:var(--muted)">실행하면 여기에 기록돼요.</p>';
      else{let t=`<table><thead><tr><th>단계</th><th>줄</th>${p.vars.map(v=>`<th>${v}</th>`).join('')}<th>조건</th><th>한 일</th></tr></thead><tbody>`;
        this.hist.slice(1).forEach((st,i,arr)=>{const f=st.info;
          t+=`<tr class="${i===arr.length-1?'cur':''}"><td>${st.step}</td><td>${f.line+1}</td>${p.vars.map(v=>`<td class="m${f.changed.includes(v)?' chg':''}">${st.vars[v]===undefined?'':(sec.includes(v)&&!this.shown[v]&&!s.done?'🔒':esc(st.vars[v]))}</td>`).join('')}<td>${f.cond?`<span class="badge ${f.cond.r?'T':'F'}">${f.cond.r?'True':'False'}</span>`:''}</td><td>${esc(f.note)}</td></tr>`});
        tb.innerHTML=t+'</tbody></table>';
        const cur=tb.querySelector('tr.cur');if(cur)tb.scrollTop=cur.offsetTop-tb.clientHeight+cur.offsetHeight+30;}
    }
    this.opt.onRender&&this.opt.onRender();
  }
}

class Pair{

  head(){if(this.g('no')){this.g('no').textContent=this.cur.no;this.g('title').textContent=this.cur.title}}
  chips(){this.g('chips').innerHTML=this.sets.map((x,i)=>`<button class="chip" data-i="${i}" aria-pressed="${x===this.cur}">${esc(x.name)}</button>`).join('')}
  select(i){if(this.cur===this.sets[i])return;this.cur=this.sets[i];this.L.load(this.cur.L);this.R.load(this.cur.R);this.chips();this.head()}
  stop(){this.L.stopAuto();this.R.stopAuto()}
}
const pConv=new Pair($('pair-convert'),PAIRS_CONVERT,{marks:true,head:true});
const pBrk=new Pair($('pair-brk'),PAIRS_BRK,{noCopy:true});

// ---------- 복사 막기 (예제 1-2, 1-3, 1-4 코드) ----------
let toastT=null;
function toast(msg){let t=document.querySelector('.toast');
  if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
const inNoCopy=n=>{n=n&&n.nodeType===3?n.parentNode:n;return !!(n&&n.closest&&n.closest('.nocopy'))};
const selHitsNoCopy=()=>{const s=getSelection();if(!s||s.isCollapsed)return false;
  if(inNoCopy(s.anchorNode)||inNoCopy(s.focusNode))return true;
  for(let i=0;i<s.rangeCount;i++){const r=s.getRangeAt(i);for(const c of document.querySelectorAll('.nocopy'))if(r.intersectsNode(c))return true}
  return false};
['copy','cut'].forEach(ev=>document.addEventListener(ev,e=>{if(selHitsNoCopy()){e.preventDefault();toast('✍️ 이 코드는 직접 입력해 보세요!')}}));
['contextmenu','dragstart','selectstart'].forEach(ev=>document.addEventListener(ev,e=>{if(inNoCopy(e.target)){e.preventDefault();if(ev==='contextmenu')toast('✍️ 이 코드는 직접 입력해 보세요!')}}));

// ---------- 탭 전환 / 키보드 / 글자 크기 ----------
const TABS=['s1','s2','s3','s4'];
const curTab=()=>TABS.includes(location.hash.slice(1))?location.hash.slice(1):'s1';
function showTab(){const t=curTab();
  document.querySelectorAll('[data-panel]').forEach(p=>p.hidden=p.dataset.panel!==t);
  document.querySelectorAll('[data-tab]').forEach(a=>a.setAttribute('aria-selected',a.dataset.tab===t));
  m1.stop();m4.stop();pConv.stop();pBrk.stop();}
window.addEventListener('hashchange',showTab);showTab();
// 예제 선택 메뉴
const GO={ex11:['s1'],cv0:['s2',0],cv1:['s2',1],ex12:['s3','L'],ex13:['s3','R'],ex14:['s4']};
$('jm').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;
  const[t,x]=GO[b.dataset.go];$('jm').open=false;
  if(location.hash.slice(1)!==t)location.hash=t;else showTab();
  let el=document.querySelector(`[data-panel="${t}"]`);
  if(t==='s2'){pConv.select(x);el=pConv.g('L').parentElement}
  if(t==='s3'){el=pBrk.g(x)}
  requestAnimationFrame(()=>{el.scrollIntoView({behavior:'smooth',block:'start'});
    if(t==='s3'){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}});
});
document.addEventListener('click',e=>{if(!e.target.closest('#jm'))$('jm').open=false});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea'))return;
  const M=curTab()==='s1'?m1:curTab()==='s4'?m4:null;if(!M)return;
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();M.r.next()}
  if(e.key==='ArrowLeft'){e.preventDefault();M.stop();M.r.prev()}
});
let fs=17;try{fs=+localStorage.getItem('wl-fs')||17}catch(e){}
const setFs=v=>{fs=Math.min(26,Math.max(13,v));document.documentElement.style.fontSize=fs+'px';try{localStorage.setItem('wl-fs',fs)}catch(e){}};
setFs(fs);$('fs-up').onclick=()=>setFs(fs+1);$('fs-down').onclick=()=>setFs(fs-1);
</script>
